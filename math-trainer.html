<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>fayf_ui — math trainer</title>
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui/tokens.css">
<style>html,body{height:100%;margin:0}
body{background:var(--canvas);display:flex}
.bx .ic{stroke:currentColor}</style>
</head>
<body>
<script type="module">
import { resolve } from './ui/model.js';
import { render } from './ui/render.js';
import { drawPaths } from './ui/path.js';
import { wireRelations } from './ui/relation.js';
import { applyMotion } from './ui/motion.js';
import { mountIcons } from './ui/icons.js';
import { initStyleMode, mountStyleToggle } from './ui/style-mode.js';
import { wireAction, wireBreadcrumbs } from './ui/actions.js';
import { createMachine } from './ui/state-machine.js';
import { mountQuiz } from './ui/quiz.js';
initStyleMode();
const reg = await (await fetch('/registry.json')).json();
const el = render(resolve(reg['screens/math-trainer-dashboard'], reg));
document.body.appendChild(el);
drawPaths(el);
el.querySelectorAll('[data-extra]').forEach(n => wireRelations(n, { host: el.querySelector('[data-name="work"]') }));
applyMotion(el);
mountIcons(el);
mountStyleToggle(el, { inline: true });
wireBreadcrumbs(el, reg);
const primaryAction = el.querySelector('[data-name="primary-action"]');
primaryAction.classList.add('bx-actionable');
primaryAction.style.cursor = 'pointer';

// Starting the quiz keeps this workspace: only "work" gets replaced,
// style/breadcrumb-trail/nav-rail all stay put -- breadcrumb gains a
// third crumb (dashboard becomes a real back-link, no longer inert)
// and the nav rail's dashboard chip dims while quiz content is shown.
const work = el.querySelector('[data-name="work"]');
const dashboardBody = [...work.children];
const breadcrumb = el.querySelector('[data-name="breadcrumb"]');
const crumbDashboard = el.querySelector('[data-name="crumb-dashboard"]');
const navDashboard = el.querySelector('[data-name="nav-dashboard"]');

function enterDashboard(ctx, send) {
  ctx.onStart = () => send('start');
  ctx.primaryAction.addEventListener('click', ctx.onStart);
}
function exitDashboard(ctx) {
  ctx.primaryAction.removeEventListener('click', ctx.onStart);
}

async function enterQuiz(ctx, send) {
  work.replaceChildren();
  // screens/quiz.json horizontally centers its content (mid) within
  // its own root box; embedding here only takes that root's
  // *children* (mountQuiz looks them up by name regardless of
  // nesting depth), so "work" needs the same centering applied
  // directly while quiz content is the sole child -- reverted in
  // exitQuiz for dashboard content, which has its own top-packed
  // multi-child layout.
  work.classList.add('bx-mid');
  resolve(reg['screens/quiz'], reg).children.forEach(c => work.appendChild(render(c)));
  const quizData = await (await fetch('/content/quiz/lesson1.json')).json();
  mountQuiz(work, quizData);

  navDashboard.classList.replace('bx-tint3', 'bx-tint1');
  breadcrumb.appendChild(render(resolve('>')));
  breadcrumb.appendChild(render(resolve({ box: 'hug', content: 'Quiz' })));
  crumbDashboard.classList.add('bx-actionable');
  crumbDashboard.style.cursor = 'pointer';
  ctx.onBack = () => send('back');
  crumbDashboard.addEventListener('click', ctx.onBack);
}
function exitQuiz(ctx) {
  crumbDashboard.removeEventListener('click', ctx.onBack);
  crumbDashboard.classList.remove('bx-actionable');
  crumbDashboard.style.cursor = '';
  breadcrumb.lastChild.remove();
  breadcrumb.lastChild.remove();
  navDashboard.classList.replace('bx-tint1', 'bx-tint3');
  work.classList.remove('bx-mid');
  work.replaceChildren(...dashboardBody);
}

createMachine({
  states: {
    dashboard: { enter: enterDashboard, exit: exitDashboard, on: { start: 'quiz' } },
    quiz: { enter: enterQuiz, exit: exitQuiz, on: { back: 'dashboard' } },
  },
  initial: 'dashboard',
  context: { primaryAction },
});

wireAction(el.querySelector('[data-name="nav-shop"]'), 'nav-shop', { reg, tipSide: 'right' });
wireAction(el.querySelector('[data-name="nav-training"]'), 'nav-training', { reg, tipSide: 'right' });
document.body.dataset.ready = '1';
</script>
</body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>fayf_ui — thw</title>
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui/tokens.css">
<style>html,body{height:100%;margin:0}
body{background:var(--canvas);display:flex}</style>
</head>
<body>
<script type="module">
import { resolve } from './ui/model.js';
import { render } from './ui/render.js';
import { initStyleMode, mountStyleToggle } from './ui/style-mode.js';
import { mountThwFromUrl } from './ui/thw.js';
import { mountInspectorToggle } from './ui/inspector.js';
initStyleMode();
const reg = await (await fetch('/registry.json')).json();
const provenance = new Map();
const el = render(resolve(reg['screens/thw-card'], reg, [], new Set(), [], provenance));
document.body.appendChild(el);
mountStyleToggle(el, { inline: true });
mountInspectorToggle(el, { sourceId: 'screens/thw-card', provenance, target: el, inline: true });
await mountThwFromUrl(el, '/content/thw/units.json', reg);
document.body.dataset.ready = '1';
</script>
</body>
</html>

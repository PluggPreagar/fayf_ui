<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>fayf_ui — query</title>
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui/tokens.css">
<style>html,body{height:100%;margin:0}
body{background:var(--canvas);display:flex}
.bx .ic{stroke:currentColor}</style>
</head>
<body>
<!-- S6 (docs/superpowers/plans/2026-09-11-workspace-dashboard.md): the shell screen
     filled by the query controller (ui/query.js, C11 L9). Machine JSON fetches the
     runs list (tolerated on failure -- stays scoped to "All runs"); a run-picker
     chip row (single-select, exclusive) plus 6 example-query chips feed a
     field:"textarea" FQL box; Run query fetches a result whose columns are
     dynamic per query, rendered by ui/table.js off a freshly built spec (no
     fixed top-level RESULTS constant -- see ui/query.js's header). -->
<script type="module">
import { resolve } from './ui/model.js';
import { render } from './ui/render.js';
import { initStyleMode, mountStyleToggle } from './ui/style-mode.js';
import { mountInspectorToggle } from './ui/inspector.js';
import { mountQuery } from './ui/query.js';
initStyleMode();
const reg = await (await fetch('/registry.json')).json();
const provenance = new Map();
const el = render(resolve(reg['screens/query'], reg, [], new Set(), [], provenance));
document.body.appendChild(el);
mountStyleToggle(el, { inline: true });
mountInspectorToggle(el, { sourceId: 'screens/query', provenance, target: el, inline: true });
window.__emitted = [];
const onEmit = (t, p) => window.__emitted.push([t, p]);
window.__ctl = mountQuery(el, reg, { onEmit });
// Second, independent mount for the error-path test: injected io, its own
// container off the body flex flow so `body > .bx` keeps the viewport.
window.__mount = (io) => {
  const container = document.createElement('div');
  container.className = 'query-mount';
  container.style.cssText = 'position:absolute;left:0;top:0;width:1200px;height:800px;visibility:hidden;display:flex';
  document.body.appendChild(container);
  const root = render(resolve(reg['screens/query'], reg));
  container.appendChild(root);
  return mountQuery(root, reg, { io, onEmit });
};
document.body.dataset.ready = '1';
</script>
</body>
</html>

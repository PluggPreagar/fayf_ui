<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>fayf_ui — profile</title>
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui/tokens.css">
<style>html,body{height:100%;margin:0}
body{background:var(--canvas);display:flex}
.bx .ic{stroke:currentColor}</style>
</head>
<body>
<!-- S6 (docs/superpowers/plans/2026-09-11-workspace-dashboard.md): the shell screen
     filled by the profile controller (ui/profile.js, C11 L9). Machine JSON fetches
     the runs list; a run-picker toggle-chip list (inline click handler, path-prefix
     matched) selects >= 2 finished runs, a fenster chip row picks the time-window
     granularity, Compute fetches the speaker comparison; one table sub-controller
     (ui/table.js) renders the speakers table, a selected row's findings render in
     the detail panel. -->
<script type="module">
import { resolve } from './ui/model.js';
import { render } from './ui/render.js';
import { initStyleMode, mountStyleToggle } from './ui/style-mode.js';
import { mountInspectorToggle } from './ui/inspector.js';
import { mountProfile } from './ui/profile.js';
initStyleMode();
const reg = await (await fetch('/registry.json')).json();
const provenance = new Map();
const el = render(resolve(reg['screens/profile'], reg, [], new Set(), [], provenance));
document.body.appendChild(el);
mountStyleToggle(el, { inline: true });
mountInspectorToggle(el, { sourceId: 'screens/profile', provenance, target: el, inline: true });
window.__emitted = [];
const onEmit = (t, p) => window.__emitted.push([t, p]);
window.__ctl = mountProfile(el, reg, { onEmit });
// Second, independent mount for the error-path test: injected io, its own
// container off the body flex flow so `body > .bx` keeps the viewport.
window.__mount = (io) => {
  const container = document.createElement('div');
  container.className = 'profile-mount';
  container.style.cssText = 'position:absolute;left:0;top:0;width:1200px;height:800px;visibility:hidden;display:flex';
  document.body.appendChild(container);
  const root = render(resolve(reg['screens/profile'], reg));
  container.appendChild(root);
  return mountProfile(root, reg, { io, onEmit });
};
document.body.dataset.ready = '1';
</script>
</body>
</html>
